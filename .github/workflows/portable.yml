name: Portable tests and packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared build and project dependencies
        run: |
          python -m pip install "setuptools>=77" wheel
          python -m pip install .
          python -m pip check
      - name: Verify source, wheel, sdist, installed CLI and bridge
        run: python scripts/verify_release.py --out runs/ci-portable
      - name: Retain checks and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            runs/ci-portable/*.log
            runs/ci-portable/*.json
            runs/ci-portable/wheels/*.whl
          if-no-files-found: warn
