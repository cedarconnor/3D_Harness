[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dcc-harness"
version = "0.21.1"
description = "Combined Blender harness and MCP with managed execution, build rules and checkpoint evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0"]
license-files = ["THIRD_PARTY_NOTICES.md", "dcc_harness/data/bridge/LICENSE.upstream"]

[project.urls]
Repository = "https://github.com/cedarconnor/3D_Harness"
Documentation = "https://github.com/cedarconnor/3D_Harness/blob/main/README.md"

[project.scripts]
dcc-harness = "dcc_harness.__main__:main"
dcc-harness-mcp = "dcc_harness.mcp_server:main"

[tool.setuptools.cmdclass]
build_py = "build_support.BundleBuild"

[tool.setuptools.packages.find]
include = ["dcc_harness*"]

[tool.setuptools.package-data]
dcc_harness = ["data/*.json", "data/*.zip", "data/bridge/*.py", "data/bridge/LICENSE.upstream"]

